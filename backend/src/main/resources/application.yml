server:
  port: 8080

spring:
  application:
    name: aquaflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquaflow}
    username: ${DB_USERNAME:aquaflow}
    password: ${DB_PASSWORD:aquaflow}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
       enabled: true
       locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:aquaflow-secret-key-for-development-only-change-in-prod}
    expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.aquaflow: INFO
    org.hibernate: WARN
