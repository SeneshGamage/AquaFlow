global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aquaflow-api"
    static_configs:
      - targets: ["aquaflow-api:8080"]
    metrics_path: /actuator/prometheus
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting: {}

rule_files:
  - /etc/prometheus/alert.rules.yml
