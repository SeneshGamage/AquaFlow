groups:
  - name: aquaflow-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on AquaFlow API"
          description: "Error rate is above 5%"

      - alert: APIDown
        expr: up{job="aquaflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AquaFlow API is down"

      - alert: HighResponseTime
        expr: http_server_requests_seconds{quantile="0.95"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile response time above 2 seconds"
