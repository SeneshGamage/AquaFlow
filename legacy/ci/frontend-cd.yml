name: "CD — Deploy Frontend to Oracle Cloud"

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/aquaflow-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/aquaflow-frontend:latest

      - name: Deploy on Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/aquaflow-frontend:latest
            docker stop aquaflow-frontend || true
            docker rm aquaflow-frontend || true
            docker run -d --name aquaflow-frontend --restart unless-stopped -p 80:80 --network aquaflow-network ${{ secrets.DOCKER_USERNAME }}/aquaflow-frontend:latest
            docker system prune -f
