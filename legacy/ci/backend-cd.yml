name: "CD — Deploy to Oracle Cloud"

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -f docker/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:latest -t ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:${{ github.sha }}

      - name: Deploy on Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:latest
            docker stop aquaflow-api || true
            docker rm aquaflow-api || true
            docker run -d --name aquaflow-api --restart unless-stopped --env-file /etc/aquaflow/.env -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/aquaflow-backend:latest
            docker system prune -f

      - name: Notify
        run: echo "Deployed successfully to production"
